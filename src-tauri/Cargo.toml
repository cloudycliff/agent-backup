[package]
name = "agent-backup"
version = "0.1.1"
description = "One-way backup for local AI agent configs"
authors = ["agent-backup"]
edition = "2021"

[lib]
name = "agent_backup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["aes-crypto", "deflate"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
whoami = "1"
globset = "0.4"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
aws-sdk-s3 = "1.141.0"
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }
aws-config = { version = "1.10.1", features = ["behavior-version-latest"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
